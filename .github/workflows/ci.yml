name: CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath
      - name: Install dependencies
        run: |
          cd backend-php
          composer install --no-progress --no-suggest --prefer-dist
      - name: Check Syntax
        run: |
          cd backend-php
          find . -name "*.php" -not -path "./vendor/*" | xargs -n 1 php -l

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps
      - name: Type Check
        run: |
          cd frontend
          npm run build
