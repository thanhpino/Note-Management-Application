services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: notes-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-notes_app}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Laravel Backend
  backend:
    build:
      context: ./backend-php
      dockerfile: Dockerfile
    container_name: notes-backend
    restart: always
    depends_on:
      - mysql
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-notes_app}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - ./backend-php:/var/www/html

  # Laravel Reverb (Real-time)
  reverb:
    build:
      context: ./backend-php
      dockerfile: Dockerfile
    container_name: notes-reverb
    restart: always
    depends_on:
      - backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notes-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_REVERB_HOST: localhost

volumes:
  db_data:
